<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Property Finder</title>
<style>
  :root {
    --page: #f6f7f6;
    --surface: #ffffff;
    --ink: #14171a;
    --ink-soft: #565f5a;
    --muted: #838a85;
    --border: #dfe3de;
    --hairline: #e9ebe7;
    --accent: #1f6b3a;
    --accent-soft: #e6f1ea;
    --good: #0b6b2e;
    --bad: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0e100f;
      --surface: #181b19;
      --ink: #f2f4f1;
      --ink-soft: #c3c9c1;
      --muted: #8b928a;
      --border: #2b302b;
      --hairline: #23261f;
      --accent: #5cc47e;
      --accent-soft: #14241a;
      --good: #5cc47e;
      --bad: #e6685f;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--page); }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 15px/1.55 -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 20px 64px; }
  .eyebrow {
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; margin: 0 0 8px;
  }
  h1 { font-size: clamp(24px, 4vw, 34px); margin: 0 0 8px; letter-spacing: -.01em; }
  h2 { font-size: 18px; margin: 34px 0 10px; }
  .spec { color: var(--ink-soft); margin: 0 0 4px; max-width: 72ch; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }
  .kpis {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px; margin: 24px 0;
  }
  .kpi {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
  }
  .kpi .r {
    font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
  }
  .kpi .v { font-size: 24px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .kpi .n { font-size: 12px; color: var(--ink-soft); }
  .movement {
    background: var(--accent-soft); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px; margin: 20px 0;
  }
  .movement-headline { margin: 0; font-weight: 600; }
  .movement-list { margin: 8px 0 0; padding-left: 18px; }
  .movement-list li { margin: 2px 0; }
  .tablewrap {
    overflow-x: auto; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface);
  }
  table {
    border-collapse: collapse; width: 100%; min-width: 760px; font-size: 13.5px;
    font-variant-numeric: tabular-nums;
  }
  th {
    text-align: left; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; padding: 10px 12px;
    border-bottom: 1px solid var(--hairline); cursor: pointer; user-select: none;
    white-space: nowrap;
  }
  th:hover { color: var(--ink); }
  th .arrow { color: var(--accent); font-weight: 700; }
  td {
    padding: 9px 12px; border-bottom: 1px solid var(--hairline); vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; white-space: nowrap; }
  a { color: var(--accent); text-decoration: none; font-weight: 600; }
  a:hover { text-decoration: underline; }
  footer {
    margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--hairline);
    font-size: 12px; color: var(--muted); max-width: 80ch;
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Property Finder &middot; market report</p>
  <h1 id="pf-title">Loading&hellip;</h1>
  <p class="spec" id="pf-spec"></p>

  <div id="pf-movement"></div>

  <div class="kpis" id="pf-kpis"></div>

  <h2>Listings</h2>
  <p class="hint">Click any column heading to sort.</p>
  <div class="tablewrap">
    <table id="pf-listings">
      <thead>
        <tr>
          <th data-key="address">Address</th>
          <th data-key="price" class="num">Price</th>
          <th data-key="beds" class="num">Beds</th>
          <th data-key="baths" class="num">Baths</th>
          <th data-key="sqft" class="num">Square feet</th>
          <th data-key="price_per_sqft" class="num">$ / square foot</th>
          <th data-key="days_on_market" class="num">Days on market</th>
          <th data-key="distance_miles" class="num">Distance</th>
          <th data-key="status">Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <footer id="pf-footer"></footer>
</div>

<script id="pf-payload" type="application/json">/*__PAYLOAD__*/{}</script>
<script>
(function () {
  "use strict";
  var payload = JSON.parse(document.getElementById("pf-payload").textContent);

  function money(n) {
    if (n === null || n === undefined) return "—";
    return "$" + Math.round(n).toLocaleString("en-US");
  }
  function plain(n) {
    if (n === null || n === undefined) return "—";
    return n.toLocaleString("en-US");
  }
  function dateOnly(ts) {
    return ts ? ts.slice(0, 10) : "—";
  }
  function deltaMoney(delta) {
    // Negative is a cut, positive is a rise — the same sign convention as the sweep
    // diff this number comes from (a home cut $20,000 arrives here as delta -20000).
    if (delta === null || delta === undefined || delta === 0) return "—";
    var abs = "$" + Math.round(Math.abs(delta)).toLocaleString("en-US");
    return delta < 0 ? ("−" + abs) : ("+" + abs);
  }

  function renderHeader() {
    document.title = payload.watch.name + " — Property Finder";
    document.getElementById("pf-title").textContent = payload.watch.name;
    var swept = payload.sweep_ts
      ? " · swept " + dateOnly(payload.sweep_ts)
      : " · no sweep on record yet";
    document.getElementById("pf-spec").textContent =
      payload.counts.total + " listing(s) within " + payload.watch.radius_miles +
      " mi of " + payload.watch.center_address + swept + ".";
  }

  function renderKpis() {
    var el = document.getElementById("pf-kpis");
    var kpis = [
      ["Listings", plain(payload.counts.total), "in the latest sweep"],
      ["Median price", money(payload.medians.price), "list price"],
      ["Median $ / square foot", money(payload.medians.price_per_sqft), ""],
      ["Median days on market", plain(payload.medians.days_on_market), ""]
    ];
    kpis.forEach(function (k) {
      var card = document.createElement("div");
      card.className = "kpi";
      var r = document.createElement("div"); r.className = "r"; r.textContent = k[0];
      var v = document.createElement("div"); v.className = "v"; v.textContent = k[1];
      var n = document.createElement("div"); n.className = "n"; n.textContent = k[2];
      card.appendChild(r); card.appendChild(v); card.appendChild(n);
      el.appendChild(card);
    });
  }

  function renderMovement() {
    var el = document.getElementById("pf-movement");
    var m = payload.movement;
    el.innerHTML = "";
    el.className = "movement";

    if (!m.history_began) {
      el.textContent = "History begins today — this is the first sweep on record.";
      return;
    }

    var headline = document.createElement("p");
    headline.className = "movement-headline";
    headline.textContent = "Since the last sweep: " + m.new.length + " new · " +
      m.cuts.length + " cut · " + m.gone.length + " gone";
    el.appendChild(headline);

    if (m.cuts.length) {
      var list = document.createElement("ul");
      list.className = "movement-list";
      m.cuts.forEach(function (c) {
        var li = document.createElement("li");
        li.textContent = (c.address || c.zpid) + ": " + deltaMoney(c.delta);
        list.appendChild(li);
      });
      el.appendChild(list);
    }
  }

  function td(text, cls) {
    var cell = document.createElement("td");
    if (cls) cell.className = cls;
    cell.textContent = text;
    return cell;
  }

  function renderRows(rows) {
    var tbody = document.querySelector("#pf-listings tbody");
    tbody.innerHTML = "";
    rows.forEach(function (r) {
      var tr = document.createElement("tr");

      var addrCell = document.createElement("td");
      if (r.link) {
        var a = document.createElement("a");
        a.href = r.link;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = r.address || r.zpid;
        addrCell.appendChild(a);
      } else {
        addrCell.textContent = r.address || r.zpid;
      }
      tr.appendChild(addrCell);

      tr.appendChild(td(money(r.price), "num"));
      tr.appendChild(td(plain(r.beds), "num"));
      tr.appendChild(td(plain(r.baths), "num"));
      tr.appendChild(td(plain(r.sqft), "num"));
      tr.appendChild(td(money(r.price_per_sqft), "num"));
      tr.appendChild(td(plain(r.days_on_market), "num"));
      tr.appendChild(td(r.distance_miles !== null && r.distance_miles !== undefined
        ? r.distance_miles.toFixed(1) + " mi" : "—", "num"));
      tr.appendChild(td(r.status || "—"));

      tbody.appendChild(tr);
    });
  }

  function wireSorting() {
    var sortKey = null;
    var sortAsc = true;
    var headers = document.querySelectorAll("#pf-listings thead th");
    headers.forEach(function (th) {
      th.addEventListener("click", function () {
        var key = th.dataset.key;
        sortAsc = sortKey === key ? !sortAsc : true;
        sortKey = key;
        var sorted = payload.listings.slice().sort(function (a, b) {
          var av = a[key], bv = b[key];
          if (av === null || av === undefined) return 1;
          if (bv === null || bv === undefined) return -1;
          if (av < bv) return sortAsc ? -1 : 1;
          if (av > bv) return sortAsc ? 1 : -1;
          return 0;
        });
        headers.forEach(function (h) {
          var arrow = h.querySelector(".arrow");
          if (arrow) arrow.remove();
        });
        var arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = sortAsc ? " ▲" : " ▼";
        th.appendChild(arrow);
        renderRows(sorted);
      });
    });
  }

  function renderFooter() {
    document.getElementById("pf-footer").textContent =
      "Source: Zillow via SearchApi.io · generated " + payload.generated_ts;
  }

  renderHeader();
  renderMovement();
  renderKpis();
  renderRows(payload.listings);
  wireSorting();
  renderFooter();
})();
</script>
</body>
</html>
