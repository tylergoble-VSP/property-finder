    GFO Home:
      note: 'Founded in 2018 by Glenn Gehan after the sale of Gehan Homes, from a fifth-generation
        homebuilding family. GFO sells the most square footage per dollar in Walsh by a wide margin
        — the Kennedy II gives you 1,649 more square feet than the Jefferson for $93,000, a marginal
        cost of about $56 a foot. Standard specification is genuinely strong for the price: masonry
        on all four sides of the first floor, 10- and 11-foot ceilings with tray accents, an 8ft 6in
        mahogany front door, a freestanding tub with separate frameless shower in the primary bath,
        and irrigation front, side and rear.'
      highlight: Two things to pin down before you fall in love with the price. GFO runs two series
        and the plan number tells you which — a leading 5 is the Presidential line, a leading 4 is
        the step-down Freedom line, so Wilson 4226 and Harding 4232 are not Presidential homes. And
        their own community page shows Phase III pricing roughly $100,000 above the figures Zillow
        carries. Ask which phase is actually selling.
      incentives: None advertised as of August 2026 — which is not the same as none available. Ask.
      contact: <b>2016 Grey Birch Place</b>, Aledo, TX 76008<br>Mon–Sat 10–6, Sun 12–6<br><b>(469)
        564-5340</b><br>Community PDF lists Tara Grehl, (469) 947-7315
      hoa: $243–$251/mo — includes the community fibre internet
