    Perry Homes:
      note: 'Founded in 1967 and still family-owned — Kathy Perry Britton owns and chairs it — with
        more than 70,000 homes built. At Walsh, Perry takes the 50-foot, 55-foot and townhome product
        while its sister brand Britton takes the wider lots, and the two share one sales office. Perry''s
        pitch is generous standard specification rather than an options game: 42-inch cabinets, granite
        with a tile backsplash, full masonry on the first floor, a GE stainless suite, tankless water
        heater, cedar fence and a smart lock all included. Every home is tested by a third-party HERS
        rater, and their structural warranty runs ten years — four years longer than Highland''s or
        GFO''s. Their full catalogue was recovered from their sitemap: 35 designs across the two sections,
        18 on 50-foot lots from the $540s and 17 on 55-foot lots from the $610s, topping out at 3,994
        square feet. The design number is simply the square footage — 2695W is 2,695 square feet —
        which is why a three-digit “Plan 213” could never have been theirs. The primary bedroom is
        downstairs on every Perry plan, including every two-storey.'
      highlight: Perry and Britton homes have been cut harder than anything else in Walsh. The deepest
        single cut we recorded anywhere was $112,000 off 14416 Game Creek Trail. Their Summer Sales
        Event requires you to present the promotional flyer at your first model visit, so download
        it before you drive out — walking in without it can forfeit the incentive.
      incentives: Summer Sales Event 2026 — must close by 30 September, requires Crestmark or Parkstone
        Mortgage, and the flyer must be presented at your first visit. The dollar figure is gated;
        the same event pays up to $55,000 in Houston and $50,000 in Austin, so ask for the Dallas
        certificate.
      contact: <b>2104 Meadow Holly Lane</b> (55ft) and <b>3953 Linear Drive</b> (50ft)<br>Shared
        with Britton Homes<br><b>(972) 202-9339</b><br>Mon–Sat 10–7, Sun 12–7 — an hour later than
