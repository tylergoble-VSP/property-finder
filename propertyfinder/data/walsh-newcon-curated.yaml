    no description and which match no builder's published inventory. Domingo Drive alone has David
    Weekley, Drees, Highland and Perry homes interleaved lot by lot, so the street tells you nothing.
    Both are worth a call precisely because an unlisted spec is often a builder's least-watched inventory.
