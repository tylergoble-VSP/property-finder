    Highland Homes:
      note: 'Highland sells the widest single product line in Walsh — twelve plans from 2,792 to 3,979
        square feet, all on 60-foot lots, and the plan number is a series code setting a minimum lot
        width rather than a size. Two things make them unusually easy to shop. Every one of the twelve
        puts the primary bedroom downstairs, and eleven of the twelve come with a three-car tandem
        garage as standard, which is the most consistent parking in the community. They also publish
        every structural option per plan — between nine and eighteen depending on the design — so
        you can price a home properly before you ever walk into a design centre. One caution that
        price alone would not suggest: Highland''s structural warranty is six years, not the ten that
        Perry, Britton and David Weekley carry — while Highland sells the most expensive production
        product in the community.'
      highlight: Their Trust Price Guarantee means no price-escalation clause in the contract, which
        in a market where builders have been repricing whole sheets is worth asking about explicitly.
        Plan 222 is the most customisable in Walsh with eighteen options; Plan 248H is the only plan
        in the community with a labelled media room.
