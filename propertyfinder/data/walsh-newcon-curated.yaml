# Everything in the Walsh new-construction report that a person researched rather than a
# database computed. Builds READ this file. Nothing ever writes it.
#
# WHY IT IS A SEPARATE FILE. The original report kept machine-derived aggregates — builder
# plan counts, medians, cut totals — in the same JSON as hand-researched prose, and the
# refresh carried the whole thing forward. Builders appeared in the roster table holding
# plans they no longer had, and the cheapest-plan column rendered `undefined`. The rule that
# follows is physical rather than disciplinary: derived blocks are recomputed on every build
# from the database, curated blocks are read from here, and `pagebuild.render`'s
# exactly-one-payload-token contract forces them to meet in exactly one place where a test
# can check the boundary (docs/PORTING-THE-REPORTS.md, lesson 5).
#
# It is also the backup. The first refresh in the original rewrote its payload in place
# before anyone had copied it, and the builder roster survived only by luck. Curated research
# does not live in a file a build writes to; it lives here, and git is the backup (lesson 8).
#
# NUMBERS IN PROSE. A sentence in a template does not know the database moved. The original
# hardcoded "Across 26 days", "and one increase", "since 11 July" and "five sweeps", and every
# one of them was wrong within a fortnight. So prose here never states a number the database
# knows: it writes `[[window_from]]`, `[[n_sweeps]]`, `[[ad_valorem]]`, and the template
# substitutes from the payload at render time. Prose that cannot drift is prose that does not
# have to be re-read every month. Numbers that are genuinely hand-researched constants — the
# component tax rates, a warranty term, a PID instalment — are written out, because nothing
# computes them and their source is recorded beside them.
#
# EVERY BLOCK CARRIES `provenance`. Source, the date it was read, and what would make it
# stale — the third field being the one that turns a citation into an instruction. A block
# whose `stale_when` has happened is a block to re-research, and a reader of this file should
# be able to tell without opening a browser.

place:
  provenance:
    source: >-
      Walsh's own community, builder and amenity pages; Aledo ISD; City of Fort Worth
      planning and TIRZ documents; developer build-out statements.
    verified_on: "2026-08-21"
    stale_when: >-
      A new neighbourhood phase opens, the H-E-B or UTA campus dates move, or the developer
      restates the build-out horizon.
  heading: A 7,200-acre cattle ranch, developed on a fifty-year clock
  lede: >-
    Walsh is not a subdivision that happened to get big. The Walsh family have held this land
    since the 1930s, ran one of the country's premier Charolais cattle operations on it, and in
    2015 chose a development partner from a national search of more than forty firms. What that
    buys you as a resident is unusual continuity — and it is worth understanding what is built
    today versus what is still a drawing.
  columns:
    - blocks:
        - heading: What is actually there now
          html: >-
            <p>The <strong>Athletic Club</strong> is a 10,000 square foot facility at 13757
            Assembly Park Drive, open every day from 5am to 10pm — cardio, free weights, a
            movement studio, with personal training and a kids' club charged separately.
            Alongside it sit a resort-style family pool with beach entry, slides and a swim-up
            island, and a separate <strong>six-lane Junior Olympic lap pool</strong>, both open
            May through October.</p>
            <p>Beyond the obvious, Walsh has a few things most master-planned communities do
            not: a <strong>makerspace</strong> opened in 2019 and refitted in 2022, a village
            market with a filling station, a co-working space, community gardens, separate
            small- and large-breed dog parks, a four-acre lagoon and a nine-acre lake with an
            eighty-foot dock. There is a <strong>Cook Children's paediatric centre on
            site</strong> and a 24-hour telehealth programme for residents. The design rule the
            developer set is that every home sits within a five-minute walk of a park.</p>
            <p>Association dues cover all of it, plus <strong>two-gigabit home
            internet</strong> and front-garden mowing. Trail mileage is quoted inconsistently
            across the community's own pages — 24, 26 and 32 miles all appear — because each
            figure describes a different build-out horizon. At full build-out the plan sets
            aside 2,300 acres of open space.</p>
        - heading: Schools
          html: >-
            <p>Walsh sits in <strong>Aledo ISD</strong>, and the elementary school is inside the
            community: <strong>Mary D. and F. Howard Walsh Elementary</strong>, named for the
            family, roughly 550 pupils. From there it is McAnally Intermediate, the Daniel Ninth
            Grade Campus, and Aledo High School. The full build-out plan provides for eight
            elementary schools, two middle schools and one high school — so the campus your
            children start at may not be the one they finish at.</p>
    - blocks:
        - heading: Where the neighbourhoods came from
          html: >-
            <p>Knowing the sequence matters, because it maps almost exactly onto the
            property-tax question further down this page — the earliest neighbourhoods carry
            the cheaper assessment.</p>
            <ul>
            <li><strong>Founders Park</strong>, 2016–17 — the first neighbourhood, 580 homes,
            and the original model row on Grey Birch Place where most sales offices still
            sit.</li>
            <li><strong>Cline Park</strong>, 2019 — the custom-homesite neighbourhood on a ridge
            with downtown Fort Worth in the distance.</li>
            <li><strong>Overlook Park and Lake Park</strong>, 2019 — 550 homesites west of the
            elementary school, adding townhomes and the nine-acre lake.</li>
            <li><strong>Brook Hollow</strong>, January 2023 — 224 homes, the largest phase since
            2020.</li>
            <li><strong>The Village</strong>, April 2023 — 138 homes, deliberately denser, next
            to the future walkable retail district.</li>
            <li><strong>Lake Park expansion</strong>, April 2026 — roughly 959 new lots running
            south and east. This is the phase currently being sold, and the one that brought a
            new builder in.</li>
            </ul>
        - heading: What is coming, and when
          html: >-
            <p>An <strong>H-E-B</strong> of nearly 128,000 square feet is under construction at
            FM 3325 and the I-20 service road, due to complete <strong>December 2026</strong>. A
            51-acre <strong>University of Texas at Arlington campus</strong> is planned to open
            in <strong>autumn 2028</strong>. Both are real and permitted rather than
            aspirational, which is not always true of master-plan renderings.</p>
            <p>The longer horizon is genuinely long. The current developer is building out about
            1,700 of the 7,200 acres — roughly 4,000 homes — targeted for completion around
            2030. Full build-out of the ranch runs to about <strong>2050</strong>, at 15,000
            single-family homes and 4,000 apartments. If you buy here you are buying into an
            active construction site for a decade, with everything that implies for both
            traffic and resale competition.</p>
          callout:
            heading: One thing not to worry about
            html: >-
              <p>Fort Worth created a <strong>tax increment reinvestment zone</strong> over
              Walsh Ranch in November 2025, running to 2107, to fund roads, sewer, water and
              trails. A zone of this kind redirects growth in existing tax revenue toward local
              infrastructure. It is not a new charge on buyers, and it should not be added to
              the tax stack.</p>

warranty:
  provenance:
    source: >-
      Each builder's own published limited-warranty document, read directly. Where a builder
      publishes none, that is recorded as "none" rather than left blank.
    verified_on: "2026-08-21"
    stale_when: A builder revises its warranty document or begins publishing one.
  lede: >-
    Structural coverage is the term that matters, because it is the only one that outlives the
    snag list. It does not track price here: the two most expensive production builders in Walsh
    carry the shortest structural warranty in the community.
  rows:
    - builder: Perry Homes
      mechanical: 2 yr
      structural: 10 yr
    - builder: Britton Homes
      mechanical: 2 yr
      structural: 10 yr
    - builder: David Weekley Homes
      mechanical: 2 yr
      structural: 10 yr
    - builder: Drees Homes
      mechanical: none
      structural: 10 yr
    - builder: Highland Homes
      mechanical: 2 yr
      structural: 6 yr
    - builder: GFO Home
      mechanical: 2 yr
      structural: 6 yr — plus binding arbitration
  columns:
    - heading: Read it as a risk price, not a perk
      html: >-
        <p>Perry, Britton and David Weekley all carry <strong>ten-year structural</strong> cover
        with a two-year mechanical tier underneath. Drees carries the full ten years structurally
        but has <strong>no mechanical tier at all</strong>, so the systems in the house fall out
        of cover after year one. Highland and GFO stop at <strong>six years</strong>
        structurally.</p>
        <p>The awkward part is who charges what. Highland sells the most expensive production
        homes in Walsh, base prices from $755,990 to $849,990, on the shortest structural term in
        the community. That is not a reason to avoid them — it is a reason to ask what the
        six-year term is worth to you, and whether a third-party structural warranty can be
        bought alongside it.</p>
    - heading: One clause worth finding before you sign
      html: >-
        <p>GFO's published warranty carries a <strong>mandatory binding-arbitration
        clause</strong> for all disputes — the only builder at Walsh where that was found in a
        published document. It also defines a structural claim narrowly: an element must be
        incapable of carrying load <em>such that the home is unsafe</em>. A cracked slab that is
        ugly but still bearing may not qualify.</p>
        <p>Against that, <strong>Highland publishes a Trust Price Guarantee</strong> — no
        price-escalation clause in the contract, the price you sign is the price you pay. On a
        nine to twelve month build in a market where builders have been repricing whole sheets,
        that is a genuine contractual protection and worth asking every other builder to match in
        writing.</p>

pid:
  provenance:
    source: >-
      City of Fort Worth PID No. 16 Service and Assessment Plan, Improvement Area 4 update
      adopted 12 May 2026 (Table IV-J and the per-parcel assessment rolls).
    verified_on: "2026-08-21"
    stale_when: >-
      The City adopts a further annual update to the Service and Assessment Plan, or a new
      improvement area is platted.
  heading: Walsh has a tax you will not find on Zillow
  rows:
    - area: Improvement Area 4 — what you buy today
      lot: 70 ft
      principal: 40193
      annual: 3271
      total: 98245
      through: 2056 at 6.60%
    - area: Improvement Area 4 — what you buy today
      lot: 60 ft
      principal: 32472
      annual: 2642
      total: 79372
      through: 2056 at 6.60%
    - area: Improvement Area 1 — an early-phase resale
      lot: 70 ft
      principal: 10515
      annual: 928
      total: null
      through: remaining balance, FY2026 instalment
  html: >-
    <p>Walsh Ranch is annexed <strong>City of Fort Worth</strong> land sitting in <strong>Parker
    County</strong> and served by <strong>Aledo ISD</strong> — a combination that surprises people
    who assume an Aledo mailing address means the City of Aledo. The ad-valorem stack for tax year
    2025 comes to <strong>[[ad_valorem]]%</strong>: Aledo ISD 1.1942, City of Fort Worth 0.6700,
    Parker County and Lateral Road 0.2851, Weatherford College 0.1061, and Parker County Hospital
    0.0841.</p>
    <p>On top of that sits <strong>Fort Worth Public Improvement District No. 16</strong> (Walsh
    Ranch / Quail Valley), created in 2016 and administered by MuniCap. There is no MUD.</p>
  callout:
    heading: The single most valuable question you can ask
    html: >-
      <p>The PID assessment is <strong>not the same for every lot in Walsh</strong>. It is set at
      platting, per improvement area, and the area now being sold carries roughly <strong>three
      and a half times</strong> the annual charge of the earliest phase. This is a property of the
      lot, not the house, and no listing anywhere discloses it. Ask every builder, in writing,
      which improvement area the specific lot sits in and what the annual instalment is. Village
      Homes markets this openly on their own plan pages, which tells you it is real.</p>
  after_table_html: >-
    <p>The gap is stark in cash terms. A new 70-foot lot carries about <strong>$3,271 a
    year</strong> — roughly <strong>$273 a month</strong> — against about <strong>$928</strong> on
    an early-phase resale of the same lot width. That difference alone, about $195 a month, is
    worth more than most of the price cuts in this report. It also runs to <strong>2056</strong> at
    6.60% interest, so a buyer today is signing up for thirty years of it, with a total of
    <strong>$98,245</strong> on a 70-foot lot. It is prepayable in full at any time.</p>
    <p>Every carry figure in this report applies the flat annual assessment this tool is configured
    with, itemised on its own line rather than folded into a rate. Treat the table above as the
    real number for a specific lot.</p>

carry:
  provenance:
    source: >-
      Walsh residential association dues schedule by lot width, cross-checked against each
      builder's own published dues figure; Texas tax-year 2025 adopted rates.
    verified_on: "2026-08-21"
    stale_when: The association publishes a new dues schedule, or a new tax year is adopted.
  heading: What the monthly number assumes
  assumptions_html: >-
    <ul>
    <li><strong>[[down_pct]]% down</strong> at <strong>[[mortgage_rate]]%</strong> over
    [[loan_term_years]] years — change any of these and every carry figure in this report
    moves.</li>
    <li><strong>[[default_tax_rate]]%</strong> ad-valorem property tax, the verified stack rather
    than a county average, plus the improvement-district assessment as a separate line.</li>
    <li><strong>$[[insurance_annual_per_1000]] per $1,000</strong> of value in insurance, about
    0.5% a year. North Texas hail makes this volatile; quote it for real.</li>
    <li><strong>Association dues are the schedule below</strong>, which is keyed to lot width and
    not to house price. A home's own dues figure is used wherever the builder publishes one.</li>
    </ul>
  dues_heading: Dues by lot width
  dues_lede: >-
    Dues cover Athletic Club membership, <strong>two-gigabit home internet</strong>, front-yard
    mowing, and every park, pool and trail. Back gardens are yours.
