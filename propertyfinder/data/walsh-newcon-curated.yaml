    and written in Perry's house style, but which match no design in Perry's 8,632-URL sitemap. That
    combination points to <strong>Britton Homes</strong>, Perry's luxury sister brand, which sells
    the wider lots out of the same office at 2104 Meadow Holly Lane. It could not be confirmed because
    brittonhomes.com is currently offline — the www subdomain does not resolve and the apex refuses
    connections.
