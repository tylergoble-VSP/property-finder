      - label: Walsh community info (PDF)
        kind: specs
        url: https://www.gfohome.com/wp-content/uploads/2024/07/Walsh-Community-Info-3.pdf
      warning: 'GFO''s warranty is the weakest at Walsh: one year workmanship, two years systems,
        and only six years structural, triggering only if an element can no longer carry load such
        that the home is unsafe. It is also the only builder here whose published warranty carries
        a mandatory binding-arbitration clause. With nine years of history and roughly fifteen public
        reviews there is not enough independent signal to underwrite build quality — budget for your
        own third-party inspection at pre-drywall and at final.'
    Village Homes:
      warning: Village Homes announced a Chapter 11 reorganization on 1 October 2025 and has published
        no update since. The company says it is still building, selling and closing homes, and that
        warranties remain in force — but no buyer should sign a build contract here without completing
        the due diligence listed below.
      note: 'A Fort Worth builder established in 1996, and the first local builder invited into Walsh
        when it opened in spring 2017. The product is genuinely distinctive: every one of their plans
        puts the primary suite on the first floor — including the 3,416 sq ft Bennett — and every
        garage is rear-entry off an alley, which is a community rule here rather than a builder choice.
        They also publish the best paper documentation in Walsh: a dimensioned handout PDF for every
        plan with the full structural option sheet, which is the single most useful thing you can
        put in front of a family. The catch is price. At a median of $259 a square foot they are the
        most expensive builder in Walsh, and that is before you weigh the bankruptcy.'
      highlight: The Limoges is 42 square feet larger than the Burgundy but $30,703 cheaper, which
        almost certainly reflects its model-home status rather than plan economics. It is also the
        only plan in the community with a true downstairs guest suite as standard.
      incentives: None advertised as of August 2026.
