    - lot: 35 ft lots
      monthly: 223
    - lot: 50 ft lots
      monthly: 233
    - lot: 55 ft lots
      monthly: 238
    - lot: 60 ft lots
      monthly: 243
    - lot: 70 ft lots
      monthly: 251
    - lot: Custom lots
      monthly: 267
    - lot: Townhomes
      monthly: "299–386"
  callout:
    heading: The trap
    html: >-
      <p>Zillow reports a flat 1.46% county-average tax rate on most Walsh homes and omits the PID
      entirely. On an $800,000 home that understates the monthly carry by roughly
      <strong>$700</strong>. If you have been budgeting from Zillow's monthly estimate, you have
      been budgeting the wrong house.</p>

practical:
  provenance:
    source: >-
      TxDOT I-30 corridor programme documents; USDA NRCS soil survey linear-extensibility data
      for the Walsh sections; Oncor and Tri-County Electric Cooperative certificated-service
      maps.
    verified_on: "2026-08-21"
    stale_when: >-
      The I-30 interchange reopens, or either utility's certificated boundary is redrawn.
  heading: Three things that are decided by the lot, not the house
  items:
    - heading: The I-30 exit is shut
      html: >-
        The eastbound Interstate 30 exit to Walsh Ranch Parkway is <strong>closed until early
        2027</strong>. TxDOT is rebuilding this corridor under a $541M programme that adds two new
        interchanges, one of them at Walsh Ranch Parkway. Drive the actual detour at rush hour
        before you commit — it is not what the sales office route will show you.
    - heading: Your soil is lot-specific
      html: >-
        Walsh spans a very wide range of shrink-swell potential, from <strong>Aledo-Bolar soils at
        a linear extensibility of about 2.5</strong>, which is excellent, to <strong>Denton clay
        around 12.0</strong>, which is very high. North Texas foundation problems track this number
        closely. Ask for the geotechnical report on the specific lot, not the community.
    - heading: Two electricity providers
      html: >-
        Walsh is <strong>dually certificated between Oncor and Tri-County Electric
        Cooperative</strong>, with the boundary running roughly east–west through the community.
        Which one serves your address is a function of the lot, and their rates and outage records
        differ.

method:
  provenance:
    source: This tool's own pipeline, and the two feed defects `dataquality.py` documents.
    verified_on: "2026-08-21"
    stale_when: >-
      The sweep's filters change, or a third systematic feed defect is found and written into
      `dataquality.py`.
  heading: How this was built, and where it can be wrong
  columns:
    - heading: Where the numbers come from
      html: >-
        <p>[[n_sweeps]] sweeps of the listing feed's Walsh inventory between [[window_from]] and
        [[window_to]], deduplicated by property ID, filtered to a two-mile radius of the community
        and then to Walsh subdivision membership. [[n_newcon]] new-construction rows survived on
        the final sweep: [[n_plans]] builder plan sheets and [[n_specs]] standing homes.</p>
        <p>Price cuts are computed by comparing each property's first and last observed asking
        price across those sweeps, so a cut that happened before [[window_from]] is invisible here.
        The true figure is therefore a <em>floor</em>, not a total.</p>
        <p>Every count, median and curve on this page is fitted on the most recent sweep alone.
        The database remembers every home it has ever seen, which is the right answer to a question
        about history and the wrong one for a page dated today — a page that counted homes which
        have since been delisted would be quietly, confidently wrong.</p>
    - heading: How builders were identified
      html: >-
        <p>The feed carries no builder field. Attribution comes first from a researched roster
        held in this repository as versioned data — 68 plan sheets and 40 standing homes, each
        entry recording the evidence it rests on and the date it was read — and then, for anything
        the roster does not cover, from plan-name and exact-footage matching back to the plan
        sheets. Every home on this page carries the tier its attribution earned, and a home whose
        evidence points at two builders is shown as unresolved rather than assigned to one.</p>
        <p>The roster exists as a file because it was lost once. It had to be reconstructed by
        parsing the data back out of an already-published page, and that it was recoverable at all
        was luck.</p>
  caveats:
    heading: What this report cannot tell you
    items:
      - >-
        <strong>Incentives are invisible to the feed.</strong> They are worth more than the price
        cuts here — a builder's event can pay tens of thousands in comparable markets — and none
        of it shows in a listing. Every home is likely cheaper than it looks.
      - >-
        <strong>Texas is a non-disclosure state.</strong> Actual sold prices are not published, so
        nothing here is calibrated against what homes truly closed at, only against asking prices.
      - >-
        <strong>Some standing homes still have no builder</strong> because their listings carry no
        description at all. They are shown as unidentified rather than guessed into a bucket.
      - >-
        <strong>Lot premiums are not separable.</strong> A base price and a finished home's price
        differ by lot, elevation, structural options and finishes all at once. The gap is not a
        discount or a markup — it is a different product.
      - >-
        <strong>Walsh's own builder directory is out of date</strong> in several places: it still
        lists Toll Brothers as active, and it publishes a stale dues schedule. Trust each builder's
        own site over the community directory.
  feed_defects:
    heading: Two things the feed gets wrong, systematically
    html: >-
      <p><strong>It rounds half-baths up.</strong> Checking every plan against the builder's own
      published specification found <strong>[[n_bath_corrections]] plans</strong> where the feed's
      bath count was too high — and the error runs one way every time, so it is bias rather than
      noise. Corrected counts are shown here and marked.</p>
      <p><strong>Its square footage is the base, not the maximum.</strong> Several plans carry
      large optional headroom that never appears in a listing: the Drees Grantley runs from 4,121
      to 4,896 square feet, and the Brynlee IV's optional second storey adds 745 feet and two
      bedrooms. Comparing a finished home's real size against a plan-sheet figure will therefore
      overstate how much extra space you are getting.</p>

leverage:
  provenance:
    source: >-
      The builder-behaviour patterns the sweep history makes visible, written up once rather
      than re-derived each build.
    verified_on: "2026-08-21"
    stale_when: The market turns and standing inventory stops aging.
  columns:
    - heading: What the movement actually means
      html: >-
        <p>A builder's published plan sheet is a price list, not a listing. When a builder moves
        that list, it is a deliberate corporate decision about a whole product line — very
        different from one homeowner dropping one price. A whole plan sheet moving by the same
        figure on the same day is not a negotiation; it is a repricing.</p>
        <p>The ready-now homes tell the same story from the other end. Every month a finished house
        stands empty, the builder pays interest on it, which is precisely the pressure that makes a
        spec home negotiable in a way a to-be-built home never is.</p>
    - heading: Where the leverage is
      html: >-
        <p>Concentrate on the standing inventory that has aged. A finished home past 90 days is a
        builder carrying real money, and it is the one place in new construction where the price is
        genuinely soft. Ask what has already come off it — the ledger below tells you before you
        walk in.</p>
        <p>Then ask for the incentive rather than the discount. Builders protect their published
        price because it sets the comp for every other home in the section, but they will spend far
        more freely on a rate buydown, closing costs, or design-centre credit. A cut you can see in
        this report is a floor for that conversation, not a ceiling.</p>
      callout:
        heading: Read this before you compare anything
        html: >-
          <p>Plan-sheet prices are <strong>base</strong> prices: no lot premium, no elevation, no
          structural options, no design-centre selections. Ready-now homes carry all of that inside
          the number. Comparing the cheapest plan against a finished spec home is not comparing two
          homes — it is comparing a starting point against a finished product. Everything in this
          report keeps the two separated for that reason.</p>

