# Who built each home, and how that was established. The feed does not say.
#
# The single most useful fact about a new-construction market — which builder is selling
# this house — is absent from the listing feed entirely. There is no builder field. So
# `propertyfinder/dataquality.py` recovers it, and this file is the part of that recovery
# a person did rather than a heuristic: the researched Walsh roster, 68 plan sheets and 40
# standing spec homes, entered as versioned data so no future accident can lose it again.
#
# WHY "AGAIN". This roster was reconstructed once already, by parsing the embedded JSON out
# of a previously published HTML report, because every working copy of it had been lost. It
# was recoverable at all by luck. Versioned data beside the code that reads it is how that
# stops being a matter of luck (docs/PORTING-THE-REPORTS.md, lesson 4).
#
# WHAT `basis` MEANS, AND WHY IT IS NOT ONE FIELD. Attribution is only ever as strong as the
# evidence for it, so each entry records which kind it rests on, and `attribute_builder`
# hands back a matching tier rather than promoting everything here to certainty:
#
#   basis: description   The builder names itself in the listing's own prose. Read off the
#                        listing, cross-checked against the builder's own plan or series
#                        page. Resolves as RESEARCHED — the strongest tier this tool has,
#                        because a person read it and wrote down where.
#   basis: plan-match    Nobody names the builder; the plan's name and its footage match
#                        one builder's published plan sheet exactly. Resolves as INFERRED,
#                        the same tier the module's own matching earns, because that is
#                        honestly what this is.
#   basis: ambiguous     The evidence points at two builders. Resolves as UNRESOLVED, and
#                        stops the heuristics rather than letting them pick. Ambiguous
#                        evidence is not weaker evidence, it is none — and the entry exists
#                        precisely so nobody re-researches it into a false certainty.
#   basis: no-evidence   A person looked and the listing carries no description at all.
#                        Recorded so the looking is not repeated; the heuristics still run,
#                        because "nothing found" is not the same as "evidence conflicts".
#
# THE STALENESS GUARD. Same doctrine as `bath-corrections.yaml`: an entry carries the values
# the feed showed when it was verified — `plan_name` and `community` for a plan sheet, the
# `address` for a spec home — and if the feed no longer says those, the entry is stale and
# is NOT applied. A builder revised a plan, or the feed renamed a community, and an old
# attribution that no longer describes the row it keys is one to re-verify, not to trust.
#
# HOW TO ADD AN ENTRY. Open the listing and read its description; if the builder names
# itself, that is `basis: description` and the entry is worth having. If it does not, open
# the builder's own plan gallery and match the plan name and footage; that is
# `basis: plan-match`. If two builders both fit — Perry Homes and Britton Homes share a
# sales office and write near-identical copy — record it as `basis: ambiguous` with both
# `candidates` and leave `builder` null. Never resolve an ambiguity by preference.
#
# Keys under `plans:` are the plan address exactly as the feed writes it, including its
# casing ("GRANTLEY Plan, Walsh Ranch 70'" — the feed shouts some plan names and not
# others). Keys under `specs:` are the zpid, because a spec home's address is spelled two
# different ways by the same feed in the same sweep and the zpid is not.
#
# `builder_series` appears where the builder's own name for a lineup differs from the
# community the feed files the plan under (Village Homes sells "Walsh 50ft Homesites";
# the feed says "Walsh"). It is provenance, not something anything computes from.

