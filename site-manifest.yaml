# What gets published, and how visible each page is. `scripts/build_site.py` copies ONLY
# the paths named here into `site/` — nothing else under reports/, and nothing outside it
# at all, ever reaches the published folder. `.env` and propertyfinder.db are unpublishable
# by construction: neither could ever be spelled as a `reports/*.html` path, which is the
# one shape of thing the copier will accept (docs/REBUILD.md, post-mortem item 8).
#
# visibility: private  -> listed on site/index.html, requires SITE_PASSWORD at the edge
# visibility: public   -> reachable by direct URL only, no password, sent noindex
#
# A `public` page is rendered by `report --public` / `map --public`, which uses the model's own
# market-neutral finance assumptions instead of a watch's — never a hand-edited config file,
# which is how the original produced its public deal map and is exactly the mechanism by which
# a private build one day ships by accident. Such a render writes a `-public` filename and a
# private render never writes one, so the two cannot be confused by a typo or a rebuild, and
# `tests/test_public_pages.py` walks every entry marked `public` and fails if the page it names
# embeds anything beyond market assumptions (docs/PORTING-THE-REPORTS.md, lesson 9).
- source: reports/walsh-aledo.html
  dest: walsh-aledo.html
  visibility: private
- source: reports/walsh-aledo-map.html
  dest: walsh-aledo-map.html
  visibility: private
- source: reports/walsh-aledo-newcon.html
  dest: walsh-aledo-newcon.html
  visibility: private
- source: reports/walsh-aledo-map-public.html
  dest: walsh-deal-map.html
  visibility: public
