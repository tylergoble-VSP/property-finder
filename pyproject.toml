[project]
name = "propertyfinder"
version = "0.1.0"
description = "A housing-market watcher: sweep listings daily, remember everything, compare, and publish what changed"
requires-python = ">=3.11"

# Core stays lean on purpose: someone who only wants to sweep a market and read a
# report should never have to install the scientific stack. The valuation layer
# (hedonic model, nearest-neighbour comps) lives behind the `stats` extra.
dependencies = [
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "pyyaml",
]

[project.optional-dependencies]
stats = [
    "numpy>=2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "pandas>=2",
]
dev = ["pytest"]

[project.scripts]
propertyfinder = "propertyfinder.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["propertyfinder*"]

# `templates/` and `data/` hold no Python, so `find` alone would leave their contents
# behind on install. Naming them here is what lets `pagebuild.render` and `segments.py`
# find their files from an installed wheel and not just from a checkout. `templates/vendor`
# is the same rule one level down: a wheel without Leaflet in it builds a map page whose
# map is a grey rectangle.
[tool.setuptools.package-data]
propertyfinder = [
    "templates/*.html",
    "templates/*.js",
    "templates/vendor/*.js",
    "templates/vendor/*.css",
    "data/*.yaml",
]
